<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard – StayEase Hotel</title>
  <meta name="description" content="Search available hotel rooms, make bookings and manage your reservations." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ════════════════════════════════════════
     NAVBAR
════════════════════════════════════════ -->
<nav class="navbar">
  <a href="/guest.html" class="navbar-brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24" width="22" height="22" stroke="#1A202C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 21h18"/>
        <path d="M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"/>
        <path d="M9 7h1"/>
        <path d="M14 7h1"/>
        <path d="M9 11h1"/>
        <path d="M14 11h1"/>
        <path d="M9 15h1"/>
        <path d="M14 15h1"/>
        <path d="M10 21v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4"/>
      </svg>
    </div>
    StayEase Hotel
  </a>
  <div class="navbar-right">
    <div class="user-info">
      <span id="nav-username">Loading…</span>
      <span class="badge badge-guest" id="nav-role">Guest</span>
    </div>
    <button class="btn btn-ghost btn-sm" id="logout-btn" onclick="logout()">
      <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span>Logout</span>
    </button>
  </div>
</nav>

<!-- ════════════════════════════════════════
     MAIN CONTENT
════════════════════════════════════════ -->
<div class="page-content">

  <!-- ── Section 1: Room Search ── -->
  <section id="section-search" style="margin-bottom: 2rem;">
    <h2 class="section-title">Find Your Perfect Room</h2>

    <!-- Search form: type filter + date range -->
    <div class="search-bar" id="search-form">
      <div class="form-group">
        <label for="search-type">Room Type</label>
        <select id="search-type" class="form-control">
          <option value="all">All Types</option>
          <option value="Single">Single</option>
          <option value="Double">Double</option>
          <option value="Suite">Suite</option>
        </select>
      </div>
      <div class="form-group">
        <label for="search-checkin">Check-In Date</label>
        <input type="date" id="search-checkin" class="form-control" />
      </div>
      <div class="form-group">
        <label for="search-checkout">Check-Out Date</label>
        <input type="date" id="search-checkout" class="form-control" />
      </div>
      <div class="form-group" style="flex: 0;">
        <label style="visibility:hidden">Search</label>
        <button class="btn btn-primary" id="search-btn" onclick="searchRooms()">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <span>Search Rooms</span>
        </button>
      </div>
    </div>

    <!-- Search results appear here -->
    <div id="search-results" style="margin-top: 1.5rem;"></div>
  </section>

  <!-- ── Section 2: My Bookings ── -->
  <section id="section-mybookings">
    <h2 class="section-title">My Bookings</h2>
    <div id="mybookings-container">
      <div class="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <p>Your bookings will appear here.</p>
      </div>
    </div>
  </section>

</div><!-- /.page-content -->

<!-- ════════════════════════════════════════
     BOOKING CONFIRMATION MODAL
════════════════════════════════════════ -->
<div class="modal-overlay" id="booking-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title-text">
  <div class="modal-box">
    <h3 class="modal-title" id="modal-title-text">
      <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/></svg>
      <span>Confirm Your Booking</span>
    </h3>

    <!-- Details filled in dynamically by JS -->
    <div id="modal-details">
      <div class="modal-detail-row">
        <span class="label">Room</span>
        <span class="value" id="modal-room-name">–</span>
      </div>
      <div class="modal-detail-row">
        <span class="label">Check-In</span>
        <span class="value" id="modal-checkin">–</span>
      </div>
      <div class="modal-detail-row">
        <span class="label">Check-Out</span>
        <span class="value" id="modal-checkout">–</span>
      </div>
      <div class="modal-detail-row">
        <span class="label">Nights</span>
        <span class="value" id="modal-nights">–</span>
      </div>
      <div class="modal-detail-row">
        <span class="label">Price per Night</span>
        <span class="value" id="modal-price-per-night">–</span>
      </div>
    </div>

    <!-- Total price (big display) -->
    <div class="modal-price" id="modal-total">₹0</div>

    <!-- Action buttons -->
    <div class="modal-actions">
      <button class="btn btn-primary" id="confirm-booking-btn" onclick="confirmBooking()" style="flex:1;">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <span>Confirm Booking</span>
      </button>
      <button class="btn btn-outline" onclick="closeModal()" style="flex:1;">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        <span>Cancel</span>
      </button>
    </div>
  </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toast-container"></div>

<script src="icons.js"></script>
<script src="guest.js"></script>
</body>
</html>
