<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard – StayEase Hotel</title>
  <meta name="description" content="Hotel admin panel to manage rooms, bookings and view statistics." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ════════════════════════════════════════
     NAVBAR
════════════════════════════════════════ -->
<nav class="navbar">
  <a href="/admin.html" class="navbar-brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24" width="22" height="22" stroke="#1A202C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 21h18"/>
        <path d="M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"/>
        <path d="M9 7h1"/>
        <path d="M14 7h1"/>
        <path d="M9 11h1"/>
        <path d="M14 11h1"/>
        <path d="M9 15h1"/>
        <path d="M14 15h1"/>
        <path d="M10 21v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4"/>
      </svg>
    </div>
    StayEase Admin
  </a>
  <div class="navbar-right">
    <div class="user-info">
      <span id="nav-username">Loading…</span>
      <span class="badge badge-admin">Admin</span>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="logout()">
      <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span>Logout</span>
    </button>
  </div>
</nav>

<!-- ════════════════════════════════════════
     ADMIN LAYOUT: SIDEBAR + MAIN
════════════════════════════════════════ -->
<div class="admin-layout">

  <!-- ── Sidebar Navigation ── -->
  <aside class="sidebar">
    <button class="sidebar-link active" id="nav-dashboard" onclick="showPanel('dashboard')">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
      <span>Dashboard</span>
    </button>
    <button class="sidebar-link" id="nav-rooms" onclick="showPanel('rooms')">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M2 19V5"/><path d="M22 19V5"/><path d="M2 17h20"/><path d="M2 10h20"/><circle cx="7" cy="7" r="2"/><circle cx="17" cy="7" r="2"/></svg>
      <span>Manage Rooms</span>
    </button>
    <button class="sidebar-link" id="nav-bookings" onclick="showPanel('bookings')">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
      <span>All Bookings</span>
    </button>
  </aside>

  <!-- ── Main Content Area ── -->
  <main class="admin-main">

    <!-- ═══════════════════════════════════
         PANEL 1: DASHBOARD STATS
    ═══════════════════════════════════ -->
    <div class="panel active" id="panel-dashboard">
      <h2 class="section-title">Dashboard Overview</h2>

      <!-- 4 stat cards in a grid -->
      <div class="grid-4" id="stats-grid">
        <div class="stat-card blue">
          <div class="stat-icon">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"/><path d="M9 7h1"/><path d="M14 7h1"/><path d="M9 11h1"/><path d="M14 11h1"/><path d="M9 15h1"/><path d="M14 15h1"/><path d="M10 21v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4"/></svg>
          </div>
          <div class="stat-value" id="stat-total-rooms">–</div>
          <div class="stat-label">Total Rooms</div>
        </div>
        <div class="stat-card yellow">
          <div class="stat-icon">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="m9 16 2 2 4-4"/></svg>
          </div>
          <div class="stat-value" id="stat-active-bookings">–</div>
          <div class="stat-label">Active Bookings Today</div>
        </div>
        <div class="stat-card green">
          <div class="stat-icon">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
          </div>
          <div class="stat-value" id="stat-occupancy">–%</div>
          <div class="stat-label">Occupancy Today</div>
        </div>
        <div class="stat-card red">
          <div class="stat-icon">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12"/><path d="M6 8h12"/><path d="M6 13l8.5 8"/><path d="M6 13h3a4 4 0 0 0 0-8"/></svg>
          </div>
          <div class="stat-value" id="stat-revenue">–</div>
          <div class="stat-label">Total Revenue</div>
        </div>
      </div>

      <!-- Quick info note -->
      <p style="margin-top:1.5rem;font-size:0.85rem;color:var(--text-muted);display:flex;align-items:center;gap:0.4rem;">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        <span>Stats update on page load. Revenue includes all past and future bookings.</span>
      </p>
    </div>

    <!-- ═══════════════════════════════════
         PANEL 2: MANAGE ROOMS
    ═══════════════════════════════════ -->
    <div class="panel" id="panel-rooms">
      <h2 class="section-title">Manage Rooms</h2>

      <!-- Add / Edit Room Form -->
      <div class="card" style="margin-bottom:1.5rem;">
        <div class="card-header">
          <h3 id="room-form-title" style="display:flex;align-items:center;gap:0.5rem;">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Add New Room</span>
          </h3>
        </div>
        <div class="card-body">
          <!-- Hidden: stores the ID of the room being edited (empty when adding) -->
          <input type="hidden" id="edit-room-id" value="" />

          <div class="form-row">
            <div class="form-group">
              <label for="room-no-input">Room Number</label>
              <input type="text" id="room-no-input" class="form-control" placeholder="e.g. 401" maxlength="10" />
            </div>
            <div class="form-group">
              <label for="room-type-input">Room Type</label>
              <select id="room-type-input" class="form-control">
                <option value="Single">Single</option>
                <option value="Double">Double</option>
                <option value="Suite">Suite</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="room-price-input">Price per Night (₹)</label>
            <input type="number" id="room-price-input" class="form-control" placeholder="e.g. 2500" min="1" step="50" />
          </div>

          <div class="form-group">
            <label for="room-desc-input">Description</label>
            <input type="text" id="room-desc-input" class="form-control" placeholder="Brief room description…" maxlength="200" />
          </div>

          <div style="display:flex;gap:0.8rem;">
            <button class="btn btn-primary" id="save-room-btn" onclick="saveRoom()">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              <span>Save Room</span>
            </button>
            <button class="btn btn-outline" id="cancel-edit-btn" onclick="cancelEdit()" style="display:none;">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              <span>Cancel Edit</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Rooms List -->
      <div id="rooms-list-container"></div>
    </div>

    <!-- ═══════════════════════════════════
         PANEL 3: ALL BOOKINGS
    ═══════════════════════════════════ -->
    <div class="panel" id="panel-bookings">
      <h2 class="section-title">All Bookings</h2>
      <div id="all-bookings-container"></div>
    </div>

  </main><!-- /.admin-main -->
</div><!-- /.admin-layout -->

<!-- Toast container -->
<div class="toast-container" id="toast-container"></div>

<script src="icons.js"></script>
<script src="admin.js"></script>
</body>
</html>
